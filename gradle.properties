# Configuración de Gradle compartida por todos (NO poner aquí rutas absolutas).
#
# El JDK que ejecuta Gradle se define en gradle/gradle-daemon-jvm.properties (JDK 21).
# Con ese archivo, Gradle IGNORA org.gradle.java.home. Si en un equipo no encuentra
# el JDK 21, indicar dónde buscarlo en el archivo del USUARIO (no del proyecto):
#   Windows: C:\Users\<usuario>\.gradle\gradle.properties
#   macOS/Linux: ~/.gradle/gradle.properties
# con la línea:
#   org.gradle.java.installations.paths=C:/Users/<usuario>/.jdks/temurin-21.0.5
#
# La ruta del SDK de Android va en local.properties (sdk.dir=...), que el IDE
# genera automáticamente, o en la variable de entorno ANDROID_HOME.

# Memoria para el proceso de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usar AndroidX
android.useAndroidX=true
# Estilo de código Kotlin
kotlin.code.style=official
# Cada librería genera su propia clase R
android.nonTransitiveRClass=true
